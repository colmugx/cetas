name: Cetas Bun Local Session Observer

on:
  pull_request:
    paths:
      - 'cetas-js/src/app/local-session-observer*'
      - 'cetas-js/ui/terminal-shell.ts'
      - 'cetas-js/host.ts'
      - 'extension'
      - '.github/workflows/posoco-session-bun.yml'
  push:
    paths:
      - 'cetas-js/src/app/local-session-observer*'
      - 'cetas-js/ui/terminal-shell.ts'
      - 'cetas-js/host.ts'
      - 'extension'
      - '.github/workflows/posoco-session-bun.yml'

jobs:
  observer:
    name: Bun owner-protocol viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun test cetas-js/src/app/local-session-observer.test.ts cetas-js/src/app/local-session-owner.test.ts
