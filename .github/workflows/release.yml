# Release pipeline for the cetas submodule (repo github.com/colmugx/cetas).
# Tag builds publish cetas-acp, cetas-run, the native cetas binary, and the
# platform-independent cetas-js node bundle (cetas-js-dist.tar.gz) plus a
# GitHub release. npm publishing (@posoco/cetas, a single JS-only package
# staged from cetas-js-dist) is manual: dispatch
# .github/workflows/npm-publish.yml on the release tag.
#
# Full release checks and dependency preparation run concurrently. Once the
# dependency artifacts are ready, platform builds can start without waiting
# for the native/JS test suites. Publishing still requires passing preflight.
#
# Dependency downloads (mooncakes registry, bun install cache) happen once per
# run: the deps job uploads them as run-scoped artifacts for the matrix (moon)
# and the platform-independent npm bundle job (moon and bun).
#
# Each job checks out cetas itself and its own extension/ submodule.
# posoco is a versioned MoonBit dependency, not a required parent checkout.
name: cetas release

on:
  push:
    tags: ["cetas-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing cetas-vX.Y.Z tag to release/retry; empty means build only"
        type: string
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || '' }}
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref || inputs.release_tag || github.ref }}

jobs:
  preflight:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout cetas and extension
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: release check (version sync gate)
        run: python3 scripts/release.py check --scope core

      - name: validate release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^cetas-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          expected="cetas-v$(cat VERSION)"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match VERSION ($expected)"
            exit 1
          fi

      - name: npm staging tests
        run: python3 -m unittest scripts/test_npm_stage.py

      - name: moon check
        run: |
          moon update
          moon check --deny-warn --output-json

      - name: moon test (native)
        run: moon test --target native --output-json

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: typecheck
        working-directory: cetas-js
        run: |
          bun install
          bun build.ts --dts-only
          bunx tsc --noEmit

      # Full cetas-js suite as a release gate: hermetic by construction
      # (fake homes, stubbed model endpoints) — no network or credentials.
      - name: cetas-js test suite
        working-directory: cetas-js
        run: bun test --preload ./moonbit-preload.ts

  # Prepare the same-run dependency artifacts independently from the slower
  # release gates. Builds can begin as soon as these downloads finish.
  deps:
    name: prepare release dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout cetas and extension
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon update (populate registry cache)
        run: moon update

      - name: upload moon registry cache
        uses: actions/upload-artifact@v6
        with:
          name: moon-registry
          path: ~/.moon/registry
          retention-days: 1

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: bun install (populate install cache)
        working-directory: cetas-js
        run: bun install

      - name: upload bun install cache
        uses: actions/upload-artifact@v6
        with:
          name: bun-cache
          path: ~/.bun/install/cache
          retention-days: 1

  build:
    name: build (${{ matrix.target }})
    needs: [deps]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
    steps:
      # core.autocrlf must be off before any checkout or generated/checked-in
      # LF files get CRLF-mangled on disk.
      - name: disable auto CRLF (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: checkout cetas and extension
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: install MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: install moon (unix)
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: install moon (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: moon version
        run: moon version --all

      # Download half of the same-run handoff from the preflight. Windows
      # needs absolute paths — artifact actions do not expand ~ on Windows.
      - name: download moon registry cache
        uses: actions/download-artifact@v7
        with:
          name: moon-registry
          path: ${{ runner.temp }}/moon-registry

      - name: restore moon registry cache
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'moon-registry'
          $target = Join-Path $HOME '.moon/registry'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

      # One workspace build produces the ACP and Run native executables. The
      # native Go host is built from that same tree afterwards, so the bridge
      # archive reuses the dependency compilation instead of redoing it.
      - name: Setup Go for native optimizer and host
        uses: actions/setup-go@v5
        with:
          go-version-file: cetas-native/go.mod
          cache: false

      - name: Configure optimized MoonBit compiler (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: cetas-native
        run: |
          go test ./tools/moon-cc-wrapper -count=1
          go build -o "$RUNNER_TEMP/moon-cc-wrapper" ./tools/moon-cc-wrapper
          echo "MOON_CC_WRAPPER=$RUNNER_TEMP/moon-cc-wrapper" >> "$GITHUB_ENV"
          echo "MOONBIT_ALLOCATOR=system" >> "$GITHUB_ENV"

      - name: Configure optimized MoonBit compiler (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: cetas-native
        run: |
          go test ./tools/moon-cc-wrapper -count=1
          go build -o "$env:RUNNER_TEMP\moon-cc-wrapper.exe" ./tools/moon-cc-wrapper
          "MOON_CC_WRAPPER=$env:RUNNER_TEMP\moon-cc-wrapper.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MOONBIT_ALLOCATOR=system" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: moon update (native workspace)
        run: moon update

      - name: moon build (native workspace release)
        run: moon build --target native --release

      # moon names the native binary main.exe on every platform; stage/ holds
      # both products under their bare release names before packaging.
      - name: collect cetas-acp (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage
          cp "_build/native/release/build/colmugx/cetas-acp/main/main.exe" "stage/cetas-acp"

      - name: collect cetas-acp (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item "_build\native\release\build\colmugx\cetas-acp\main\main.exe" -Destination "stage\cetas-acp.exe"

      - name: version smoke (unix)
        if: matrix.os != 'windows-latest'
        working-directory: stage
        run: |
          out="$(./cetas-acp --version)"
          echo "$out"
          if [[ -n "$RELEASE_TAG" ]]; then
            expected="cetas-acp ${RELEASE_TAG#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi

      - name: version smoke (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: stage
        shell: pwsh
        run: |
          $out = (& ".\cetas-acp.exe" --version) -join ' '
          $out
          if ($env:RELEASE_TAG) {
            $expected = "cetas-acp " + ($env:RELEASE_TAG -replace '^cetas-v', '')
            if ($out.Trim() -ne $expected) {
              Write-Host "::error::--version mismatch: got '$out', want '$expected'"
              exit 1
            }
          }

      - name: collect cetas-run (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage
          cp "_build/native/release/build/colmugx/cetas-run/main/main.exe" "stage/cetas-run"

      - name: collect cetas-run (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item "_build\native\release\build\colmugx\cetas-run\main\main.exe" -Destination "stage\cetas-run.exe"

      - name: version smoke cetas-run (unix)
        if: matrix.os != 'windows-latest'
        working-directory: stage
        run: |
          out="$(./cetas-run --version)"
          echo "$out"
          if [[ -n "$RELEASE_TAG" ]]; then
            expected="cetas-run ${RELEASE_TAG#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi

      - name: version smoke cetas-run (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: stage
        shell: pwsh
        run: |
          $out = (& ".\cetas-run.exe" --version) -join ' '
          $out
          if ($env:RELEASE_TAG) {
            $expected = "cetas-run " + ($env:RELEASE_TAG -replace '^cetas-v', '')
            if ($out.Trim() -ne $expected) {
              Write-Host "::error::--version mismatch: got '$out', want '$expected'"
              exit 1
            }
          }

      # Unix continues to statically link the size-optimized MoonBit bridge.
      - name: compile MoonBit bridge archive (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          moon build cetas-native/native_bridge --target native --release
          src="_build/native/release/build/colmugx/cetas-native/native_bridge/native_bridge.a"
          mkdir -p cetas-native/go_bridge/lib
          cp "$src" cetas-native/go_bridge/lib/libcetas_moon.a

      - name: build cetas (unix)
        if: matrix.os != 'windows-latest'
        working-directory: cetas-native
        env:
          CGO_ENABLED: '1'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            go build -trimpath -ldflags="-s -w -linkmode=external -extldflags=-Wl,--gc-sections" -o ../stage/cetas .
          else
            go build -trimpath -ldflags="-s -w -linkmode=external -extldflags=-Wl,-dead_strip" -o ../stage/cetas .
          fi

      - name: version smoke cetas (unix)
        if: matrix.os != 'windows-latest'
        working-directory: stage
        run: |
          out="$(./cetas --version)"
          echo "$out"
          if [[ -n "$RELEASE_TAG" ]]; then
            expected="cetas ${RELEASE_TAG#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi
          # The handover dispatches are shipped entry points: prove both
          # siblings sit beside the binary and still answer.
          ./cetas acp --version
          ./cetas run --version

      # Only the native cetas executable is ad-hoc signed on macOS.
      # ACP and Run ship unsigned; Windows cetas signing happens in native-windows.
      - name: ad-hoc sign macOS cetas executable
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - stage/cetas
          codesign --verify --strict --verbose=2 stage/cetas
          stage/cetas --version

      # Release body = the CHANGELOG section for this version. Section end is
      # the next VERSION heading (`## X.Y.Z (` or `## Unreleased`) — notes
      # bodies carry their own `## Ver.` headings and must not end the scan.
      # No body on workflow_dispatch.
      - name: extract release body
        if: matrix.os == 'ubuntu-latest' && env.RELEASE_TAG != ''
        run: |
          ver="${RELEASE_TAG#cetas-v}"
          awk -v hdr="## ${ver} " 'index($0, hdr) == 1 {on=1; next} /^## ([0-9]+\.[0-9]+\.[0-9]+|Unreleased)( |\(|$)/ {on=0} on' CHANGELOG.md > stage/release_body.md

      - name: package (unix)
        if: matrix.os != 'windows-latest'
        working-directory: stage
        run: |
          tar -czf "cetas-acp-${{ matrix.target }}.tar.gz" cetas-acp
          tar -czf "cetas-run-${{ matrix.target }}.tar.gz" cetas-run
          tar -czf "cetas-${{ matrix.target }}.tar.gz" cetas

      - name: package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: stage
        shell: pwsh
        run: |
          Compress-Archive -Path "cetas-acp.exe" -DestinationPath "cetas-acp-windows-x64.zip" -Force
          Compress-Archive -Path "cetas-run.exe" -DestinationPath "cetas-run-windows-x64.zip" -Force

      - name: upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: |
            stage/*.tar.gz
            stage/*.zip
            stage/release_body.md

  native-windows:
    name: release (windows native DLL)
    needs: [deps]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/setup-go@v5
        with:
          go-version-file: cetas-native/go.mod
          cache: false
      - name: Configure optimized MoonBit compiler
        working-directory: cetas-native
        shell: pwsh
        run: |
          go test ./tools/moon-cc-wrapper -count=1
          go build -o "$env:RUNNER_TEMP\moon-cc-wrapper.exe" ./tools/moon-cc-wrapper
          "MOON_CC_WRAPPER=$env:RUNNER_TEMP\moon-cc-wrapper.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MOONBIT_ALLOCATOR=system" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build MoonBit runtime
        run: |
          moon update
          moon build --target native --release
      - name: Build MSVC DLL
        shell: pwsh
        run: ./cetas-native/tools/build_windows_dll.ps1 -OutputDir stage
      - name: Test Windows Go bridge (no cgo)
        working-directory: cetas-native
        env:
          CGO_ENABLED: '0'
          CETAS_NATIVE_DLL: ${{ github.workspace }}\stage\cetas_moon.dll
        run: go test ./... -count=1
      - name: Build pure Go TUI
        working-directory: cetas-native
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ../stage/cetas.exe .
      - name: Collect ACP and Run siblings
        shell: pwsh
        run: |
          Copy-Item "_build/native/release/build/colmugx/cetas-acp/main/main.exe" -Destination "stage/cetas-acp.exe"
          Copy-Item "_build/native/release/build/colmugx/cetas-run/main/main.exe" -Destination "stage/cetas-run.exe"
      - name: Version smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& ./stage/cetas.exe --version) -join ' '
          if ($LASTEXITCODE -ne 0) { throw "cetas.exe version smoke failed" }
          if ($env:RELEASE_TAG -and $actual.Trim() -ne ("cetas " + ($env:RELEASE_TAG -replace '^cetas-v', ''))) {
            throw "version mismatch: $actual"
          }
          & ./stage/cetas.exe acp --version
          if ($LASTEXITCODE -ne 0) { throw "cetas acp dispatch failed" }
          & ./stage/cetas.exe run --version
          if ($LASTEXITCODE -ne 0) { throw "cetas run dispatch failed" }
      # This job owns cetas.exe and cetas_moon.dll; ACP and Run remain unsigned.
      - name: Self-sign Windows cetas EXE and native DLL (untrusted)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Ephemeral CI-only certificate; not a trusted publisher signature.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Cetas CI Self-Signed (Untrusted)" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -KeyAlgorithm RSA -KeyLength 3072
          foreach ($file in @("stage\cetas.exe", "stage\cetas_moon.dll")) {
            $signed = Set-AuthenticodeSignature -FilePath $file -Certificate $cert -HashAlgorithm SHA256
            if ($signed.SignatureType -ne 'Authenticode' -or $null -eq $signed.SignerCertificate) {
              throw "Signing failed for ${file}: $($signed.StatusMessage)"
            }
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.SignatureType -ne 'Authenticode' -or
                $null -eq $sig.SignerCertificate -or
                $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Missing or unexpected signature on $file"
            }
            Write-Host "$file : signature present; trust status=$($sig.Status)"
          }
          & ./stage/cetas.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Signed executable failed" }
      - name: Package executable and adjacent DLL
        shell: pwsh
        working-directory: stage
        run: Compress-Archive -Path "cetas.exe", "cetas-acp.exe", "cetas-run.exe", "cetas_moon.dll" -DestinationPath "cetas-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v6
        with:
          name: binary-native-windows-x64
          path: stage/cetas-windows-x64.zip

  cetas-js-dist:
    name: build cetas-js npm dist (node bundle)
    needs: [deps]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout cetas and extension
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          submodules: recursive

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: download moon registry cache
        uses: actions/download-artifact@v7
        with:
          name: moon-registry
          path: ${{ runner.temp }}/moon-registry

      - name: download bun install cache
        uses: actions/download-artifact@v7
        with:
          name: bun-cache
          path: ${{ runner.temp }}/bun-cache

      - name: restore dependency caches
        shell: pwsh
        run: |
          foreach ($cache in @(
            @{ source = (Join-Path $env:RUNNER_TEMP 'moon-registry'); target = (Join-Path $HOME '.moon/registry') },
            @{ source = (Join-Path $env:RUNNER_TEMP 'bun-cache'); target = (Join-Path $HOME '.bun/install/cache') }
          )) {
            New-Item -ItemType Directory -Force -Path $cache.target | Out-Null
            Copy-Item -Path (Join-Path $cache.source '*') -Destination $cache.target -Recurse -Force
          }

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: bun install
        working-directory: cetas-js
        run: bun install

      - name: moon update (cetas-js)
        working-directory: cetas-js
        run: moon update

      # Platform-independent JS bundle: no per-platform matrix, one artifact
      # feeds the npm staging (manual dispatch of npm-publish.yml).
      - name: build node bundle
        working-directory: cetas-js
        run: bun build.ts --node-bundle

      - name: package dist
        working-directory: cetas-js
        run: tar -czf cetas-js-dist.tar.gz -C dist cetas.js

      - name: upload dist
        uses: actions/upload-artifact@v6
        with:
          name: cetas-js-dist
          path: cetas-js/cetas-js-dist.tar.gz

  release:
    name: publish GitHub release
    needs: [preflight, build, native-windows, cetas-js-dist]
    if: startsWith(github.ref, 'refs/tags/cetas-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Named downloads, not "download all": the run also carries the
      # preflight's moon/bun cache artifacts, which must not reach staging.
      - name: download binaries (darwin-arm64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-darwin-arm64
          path: staging

      - name: download binaries (linux-x64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-linux-x64
          path: staging

      - name: download binaries (windows-x64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-windows-x64
          path: staging

      - name: download Windows native DLL bundle
        uses: actions/download-artifact@v7
        with:
          name: binary-native-windows-x64
          path: staging

      - name: download cetas-js dist
        uses: actions/download-artifact@v7
        with:
          name: cetas-js-dist
          path: staging

      # Drop the body file when missing or empty; the empty output then omits
      # body_path so the release is created without a body.
      - name: guard release body
        id: relbody
        run: |
          if [[ -s staging/release_body.md ]]; then
            echo "path=staging/release_body.md" >> "$GITHUB_OUTPUT"
          else
            rm -f staging/release_body.md
          fi

      - name: checksums
        working-directory: staging
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            staging/*.tar.gz
            staging/*.zip
            staging/SHA256SUMS
          body_path: ${{ steps.relbody.outputs.path }}

