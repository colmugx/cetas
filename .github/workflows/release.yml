# Release pipeline for the cetas submodule (repo github.com/colmugx/cetas).
# Tag builds publish cetas-acp, cetas-run, and the native cetas binary plus
# a GitHub release. npm publishing (@posoco/cetas + @posoco/cetas-<target> payload packages)
# is manual: dispatch .github/workflows/npm-publish.yml on the release tag.
#
# A single Ubuntu preflight runs version sync, staging tests, moon check/test,
# and TypeScript typecheck before any platform build starts. Only after it
# passes does the three-platform build matrix fan out.
#
# Dependency downloads (mooncakes registry, bun install cache) happen once per
# run: the preflight uploads them as run-scoped artifacts and every matrix job
# downloads them, so no platform re-fetches what another platform already got.
#
# Every build job checks out colmugx/posoco and points the embedded
# external/cetas submodule at the tag being released. This stays correct
# whatever the committed state of cetas' moon.work turns out to be: with no
# moon.work (or one without "../..") each module resolves deps from its
# moon.mod pins and the parent checkout is harmless; with "../.." the
# workspace resolves against the checked-out parent.
name: cetas release

on:
  push:
    tags: ["cetas-v*"]
  workflow_dispatch:
    inputs:
      posoco_ref:
        description: "posoco ref to build against"
        default: "main"

permissions:
  contents: write

env:
  POSOCO_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.posoco_ref || 'main' }}

jobs:
  preflight:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout posoco workspace
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: ${{ env.POSOCO_REF }}
          path: posoco
          submodules: recursive

      - name: switch embedded cetas to the release tag
        if: github.event_name == 'push'
        working-directory: posoco/external/cetas
        shell: bash
        run: |
          git fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"

      - name: init nested submodules
        working-directory: posoco/external/cetas
        shell: bash
        run: git submodule update --init --recursive

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: release check (version sync gate)
        working-directory: posoco/external/cetas
        run: python3 scripts/release.py check --scope core

      - name: npm staging tests
        working-directory: posoco/external/cetas
        run: python3 -m unittest scripts/test_npm_stage.py

      - name: moon check (ACP public recipe, native)
        working-directory: posoco/external/cetas/cetas-acp
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon update
          moon check --target native --deny-warn --output-json

      - name: moon check (Run public recipe, native)
        working-directory: posoco/external/cetas/cetas-run
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon check --target native --deny-warn --output-json

      - name: moon check (Run public recipe, wasm)
        working-directory: posoco/external/cetas/cetas-run
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon check --target wasm --deny-warn --output-json

      - name: moon check (JS public recipe)
        working-directory: posoco/external/cetas/cetas-js
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon check --target js --deny-warn --output-json

      - name: moon test (native)
        id: test
        working-directory: posoco/external/cetas/cetas-acp
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon test --target native --output-json

      # Keep release gating aligned with CI's one-shot retry for the known
      # async-ordering flaky test.
      - name: moon test (native, flake rerun)
        if: failure() && steps.test.outcome == 'failure'
        working-directory: posoco/external/cetas/cetas-acp
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon test --target native --output-json

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: moon update (cetas-js)
        working-directory: posoco/external/cetas/cetas-js
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon update

      # Upload half of the same-run handoff; build needs: [preflight], so the
      # matrix jobs download these instead of re-fetching over the network.
      - name: upload moon registry cache
        uses: actions/upload-artifact@v6
        with:
          name: moon-registry
          path: ~/.moon/registry
          retention-days: 1

      - name: typecheck
        working-directory: posoco/external/cetas/cetas-js
        run: |
          bun install
          bun build.ts --dts-only
          bunx tsc --noEmit

      - name: upload bun install cache
        uses: actions/upload-artifact@v6
        with:
          name: bun-cache
          path: ~/.bun/install/cache
          retention-days: 1

  build:
    name: build (${{ matrix.target }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
    steps:
      # core.autocrlf must be off before any checkout or generated/checked-in
      # LF files get CRLF-mangled on disk.
      - name: disable auto CRLF (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: checkout posoco workspace
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: ${{ env.POSOCO_REF }}
          path: posoco
          submodules: recursive

      # Tag builds must compile exactly the tagged revision, not whatever
      # posoco@POSOCO_REF currently points at.
      - name: switch embedded cetas to the release tag
        if: github.event_name == 'push'
        working-directory: posoco/external/cetas
        shell: bash
        run: |
          git fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"

      # On dispatch the submodule stays at the posoco@ref pointer; this still
      # syncs the nested extension/ submodule.
      - name: init nested submodules
        working-directory: posoco/external/cetas
        shell: bash
        run: git submodule update --init --recursive

      - name: install MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: install moon (unix)
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: install moon (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: moon version
        run: moon version --all

      # Download half of the same-run handoff from the preflight. Windows
      # needs absolute paths — artifact actions do not expand ~ on Windows.
      - name: download moon registry cache
        uses: actions/download-artifact@v7
        with:
          name: moon-registry
          path: ${{ matrix.os == 'windows-latest' && 'C:\Users\runneradmin\.moon\registry' || '~/.moon/registry' }}

      - name: download bun install cache
        uses: actions/download-artifact@v7
        with:
          name: bun-cache
          path: ${{ matrix.os == 'windows-latest' && 'C:\Users\runneradmin\.bun\install\cache' || '~/.bun/install/cache' }}

      - name: prepare public acp recipe (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas
        run: python3 scripts/prepare-recipe.py --flavor public --frontend all --platform unix

      - name: prepare public acp recipe (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas
        shell: pwsh
        run: python scripts/prepare-recipe.py --flavor public --frontend all --platform windows

      - name: moon update (cetas-acp)
        working-directory: posoco/external/cetas/cetas-acp
        run: moon update

      # _build lands at the cetas workspace ROOT (moon.work dir), not under cetas-acp
      - name: moon build (native release)
        working-directory: posoco/external/cetas/cetas-acp
        run: moon build --target native --release

      # moon names the native binary main.exe on every platform; stage/ holds
      # both products under their bare release names before packaging.
      - name: collect cetas-acp (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/cetas-acp
        run: |
          mkdir -p ../stage
          cp "../_build/native/release/build/colmugx/cetas-acp/main/main.exe" "../stage/cetas-acp"

      - name: collect cetas-acp (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/cetas-acp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\stage" | Out-Null
          Copy-Item "..\_build\native\release\build\colmugx\cetas-acp\main\main.exe" -Destination "..\stage\cetas-acp.exe"

      - name: version smoke (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/stage
        run: |
          out="$(./cetas-acp --version)"
          echo "$out"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="cetas-acp ${GITHUB_REF_NAME#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi

      - name: version smoke (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/stage
        shell: pwsh
        run: |
          $out = (& ".\cetas-acp.exe" --version) -join ' '
          $out
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $expected = "cetas-acp " + ($env:GITHUB_REF_NAME -replace '^cetas-v', '')
            if ($out.Trim() -ne $expected) {
              Write-Host "::error::--version mismatch: got '$out', want '$expected'"
              exit 1
            }
          }

      - name: prepare public run recipe (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas
        run: python3 scripts/prepare-recipe.py --flavor public --frontend all --platform unix

      - name: prepare public run recipe (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas
        shell: pwsh
        run: python scripts/prepare-recipe.py --flavor public --frontend all --platform windows

      - name: moon update (cetas-run)
        working-directory: posoco/external/cetas/cetas-run
        run: moon update

      # same workspace _build root as cetas-acp (moon.work), own package dir
      - name: moon build cetas-run (native release)
        working-directory: posoco/external/cetas/cetas-run
        run: moon build --target native --release

      - name: collect cetas-run (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/cetas-run
        run: |
          mkdir -p ../stage
          cp "../_build/native/release/build/colmugx/cetas-run/main/main.exe" "../stage/cetas-run"

      - name: collect cetas-run (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/cetas-run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\stage" | Out-Null
          Copy-Item "..\_build\native\release\build\colmugx\cetas-run\main\main.exe" -Destination "..\stage\cetas-run.exe"

      - name: version smoke cetas-run (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/stage
        run: |
          out="$(./cetas-run --version)"
          echo "$out"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="cetas-run ${GITHUB_REF_NAME#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi

      - name: version smoke cetas-run (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/stage
        shell: pwsh
        run: |
          $out = (& ".\cetas-run.exe" --version) -join ' '
          $out
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $expected = "cetas-run " + ($env:GITHUB_REF_NAME -replace '^cetas-v', '')
            if ($out.Trim() -ne $expected) {
              Write-Host "::error::--version mismatch: got '$out', want '$expected'"
              exit 1
            }
          }

      - name: package cetas-tui static library
        working-directory: posoco/external/cetas
        run: node cetas-native/scripts/package_staticlib.js --out "stage/cetas-tui-prebuilt-${{ matrix.target }}" --target "${{ matrix.target }}"

      - name: prepare public native recipe (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas
        run: python3 scripts/prepare-recipe.py --flavor public --frontend native --platform unix

      - name: prepare public native recipe (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas
        shell: pwsh
        run: python scripts/prepare-recipe.py --flavor public --frontend native --platform windows

      - name: moon update (cetas-native)
        working-directory: posoco/external/cetas
        run: moon update

      - name: build native Cetas terminal host
        working-directory: posoco/external/cetas
        env:
          CETAS_TUI_PREBUILT_DIR: ${{ github.workspace }}/posoco/external/cetas/stage/cetas-tui-prebuilt-${{ matrix.target }}
          CETAS_TUI_FORCE_PREBUILT: "1"
        run: moon build cetas-native/src/cetas --target native --release

      - name: collect native Cetas (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas
        run: cp "_build/native/release/build/colmugx/cetas-native/src/cetas/cetas.exe" "stage/cetas"

      - name: collect native Cetas (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas
        shell: pwsh
        run: Copy-Item "_build\native\release\build\colmugx\cetas-native\src\cetas\cetas.exe" -Destination "stage\cetas.exe"

      - name: version smoke native Cetas (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/stage
        run: |
          out="$(./cetas --version)"
          echo "$out"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="cetas ${GITHUB_REF_NAME#cetas-v}"
            [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }
          fi

      - name: version smoke native Cetas (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/stage
        shell: pwsh
        run: |
          $out = (& ".\cetas.exe" --version) -join ' '
          $out
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $expected = "cetas " + ($env:GITHUB_REF_NAME -replace '^cetas-v', '')
            if ($out.Trim() -ne $expected) {
              Write-Host "::error::--version mismatch: got '$out', want '$expected'"
              exit 1
            }
          }

      # Release body = the CHANGELOG section for this version. Section end is
      # the next VERSION heading (`## X.Y.Z (` or `## Unreleased`) — notes
      # bodies carry their own `## Ver.` headings and must not end the scan.
      # No body on workflow_dispatch.
      - name: extract release body
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        working-directory: posoco/external/cetas
        run: |
          ver="${GITHUB_REF_NAME#cetas-v}"
          awk -v hdr="## ${ver} " 'index($0, hdr) == 1 {on=1; next} /^## ([0-9]+\.[0-9]+\.[0-9]+|Unreleased)( |\(|$)/ {on=0} on' CHANGELOG.md > stage/release_body.md

      - name: package (unix)
        if: matrix.os != 'windows-latest'
        working-directory: posoco/external/cetas/stage
        run: |
          tar -czf "cetas-${{ matrix.target }}.tar.gz" cetas
          tar -czf "cetas-tui-staticlib-${{ matrix.target }}.tar.gz" -C "cetas-tui-prebuilt-${{ matrix.target }}" .
          tar -czf "cetas-acp-${{ matrix.target }}.tar.gz" cetas-acp
          tar -czf "cetas-run-${{ matrix.target }}.tar.gz" cetas-run

      - name: package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: posoco/external/cetas/stage
        shell: pwsh
        run: |
          Compress-Archive -Path "cetas.exe" -DestinationPath "cetas-windows-x64.zip" -Force
          Compress-Archive -Path "cetas-tui-prebuilt-windows-x64\*" -DestinationPath "cetas-tui-staticlib-windows-x64.zip" -Force
          Compress-Archive -Path "cetas-acp.exe" -DestinationPath "cetas-acp-windows-x64.zip" -Force
          Compress-Archive -Path "cetas-run.exe" -DestinationPath "cetas-run-windows-x64.zip" -Force

      - name: upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: |
            posoco/external/cetas/stage/*.tar.gz
            posoco/external/cetas/stage/*.zip
            posoco/external/cetas/stage/release_body.md

  mooncakes:
    name: publish cetas-run to Mooncakes
    needs: [preflight]
    if: startsWith(github.ref, 'refs/tags/cetas-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: prepare public run recipe
        run: python3 scripts/prepare-recipe.py --flavor public --frontend all --platform unix

      - name: moon update
        working-directory: cetas-run
        run: moon update

      - name: moon check
        working-directory: cetas-run
        run: moon check --target wasm --deny-warn --output-json

      - name: publish cetas-run
        working-directory: cetas-run
        run: |
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
        env:
          SECRET: ${{ secrets.MOONCAKES_TOKEN }}

  release:
    name: publish GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/cetas-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Named downloads, not "download all": the run also carries the
      # preflight's moon/bun cache artifacts, which must not reach staging.
      - name: download binaries (darwin-arm64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-darwin-arm64
          path: staging

      - name: download binaries (linux-x64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-linux-x64
          path: staging

      - name: download binaries (windows-x64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-windows-x64
          path: staging

      # Drop the body file when missing or empty; the empty output then omits
      # body_path so the release is created without a body.
      - name: guard release body
        id: relbody
        run: |
          if [[ -s staging/release_body.md ]]; then
            echo "path=staging/release_body.md" >> "$GITHUB_OUTPUT"
          else
            rm -f staging/release_body.md
          fi

      - name: checksums
        working-directory: staging
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/*.tar.gz
            staging/*.zip
            staging/SHA256SUMS
          body_path: ${{ steps.relbody.outputs.path }}

