# cetas CI — push to main + pull requests.
#
# Every job checks out colmugx/posoco@main recursively and pins the embedded
# external/cetas submodule to the commit under test. This stays correct
# whatever the committed state of cetas' moon.work turns out to be: with no
# moon.work (or one without "../..") each module resolves deps from its
# moon.mod pins and the parent checkout is harmless; with "../.." the
# workspace resolves against the checked-out parent.

name: cetas ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "cetas-memoh/**"
      - "scripts/memoh_live_e2e.py"
      - "scripts/test_memoh_live_e2e.py"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"
  pull_request:
    paths-ignore:
      - "cetas-memoh/**"
      - "scripts/memoh_live_e2e.py"
      - "scripts/test_memoh_live_e2e.py"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CETAS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout posoco parent (recursively)
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: main
          path: posoco
          submodules: recursive

      - name: Switch cetas submodule to event commit
        shell: bash
        working-directory: posoco/external/cetas
        run: |
          git fetch --depth=1 origin "${CETAS_SHA}"
          git checkout "${CETAS_SHA}"
          # nested extension/ gitlinks come from the cetas commit under test
          git submodule update --init --recursive

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: Version-sync gate
        working-directory: posoco/external/cetas
        run: python3 scripts/release.py check --scope core

      - name: npm staging tests
        working-directory: posoco/external/cetas
        run: python3 -m unittest scripts/test_npm_stage.py

      - name: moon check (public)
        working-directory: posoco/external/cetas
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon update
          moon check --deny-warn --output-json

      - name: moon fmt
        working-directory: posoco/external/cetas
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon fmt --check

      # drift gate scoped to the cetas dirs; the posoco root is at main and
      # not ours to gate
      - name: moon info + interface drift gate
        working-directory: posoco/external/cetas
        run: |
          # Interface drift is checked against the public graph.
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon info
          git diff --exit-code -- . ../cetas-js ../cetas-core ../cetas-run ../cetas-acp ../cetas-ext-forme

      - name: moon test
        id: test
        working-directory: posoco/external/cetas
        run: |
          python3 ../scripts/prepare-recipe.py --flavor public --frontend all --platform unix
          moon test --target native --output-json

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: cetas-js typecheck
        working-directory: posoco/external/cetas/cetas-js
        run: |
          bun install
          bun build.ts --dts-only
          bunx tsc --noEmit

      - name: cetas-js lifecycle tests
        working-directory: posoco/external/cetas/cetas-js
        run: |
          bun test --preload ./moonbit-preload.ts \
            src/app/operation-coordinator.test.ts \
            src/app/application.test.ts \
            src/app/rate-limit-recovery.test.ts \
            src/controllers/event-router.test.ts \
            ui/terminal-shell.test.ts

      - name: Setup Node for cetas-web
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: cetas-web typecheck + build
        working-directory: posoco/external/cetas/cetas-web/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
