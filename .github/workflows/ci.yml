name: cetas ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "cetas-memoh/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"
  pull_request:
    paths-ignore:
      - "cetas-memoh/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # cetas is the main project; extension is its only submodule.
      - name: Checkout cetas (with extension submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: Version-sync gate
        run: python3 scripts/release.py check --scope core

      - name: Shell installer syntax
        run: |
          bash -n install.sh
          bash install.sh --help >/dev/null

      - name: npm staging tests
        run: python3 -m unittest scripts/test_npm_stage.py

      - name: package-manager manifest generator tests
        run: python3 -m unittest scripts/test_package_managers.py

      - name: moon check (public)
        run: |
          moon update
          moon check --deny-warn --output-json

      - name: moon fmt
        run: moon fmt

      - name: moon info + interface drift gate
        run: |
          # Interface drift is checked against the public graph.
          moon info
          git -c diff.ignoreSubmodules=dirty diff --exit-code -- . ./cetas-js ./cetas-core ./cetas-run ./cetas-acp ./cetas-ext-forme

      - name: moon test
        id: test
        run: moon test --target native --output-json

      # Node 24 is Active LTS; pin it before all JS/Node distribution tests.
      - name: Setup Node LTS for cetas-js
        # Collect JS diagnostics even if the independent Moon native suite fails.
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup bun
        # Collect JS diagnostics even if the independent Moon native suite fails.
        if: ${{ !cancelled() }}
        uses: oven-sh/setup-bun@v2

      - name: cetas-js typecheck
        # Collect JS diagnostics even if the independent Moon native suite fails.
        if: ${{ !cancelled() }}
        working-directory: cetas-js
        run: |
          bun install
          bun build.ts --dts-only
          bunx tsc --noEmit

      # Full cetas-js suite: unit + integration + the self-spawning pi
      # adaptor scenarios. Running everything (not a subset) is the point —
      # subset-only CI is how tests rotted unnoticed before.
      - name: cetas-js test suite
        # Collect JS diagnostics even if the independent Moon native suite fails.
        if: ${{ !cancelled() }}
        working-directory: cetas-js
        run: bun test --preload ./moonbit-preload.ts

      - name: cetas-web typecheck + build
        working-directory: cetas-web/web
        run: |
          bun install --no-audit --no-fund
          bun run check
          bun run build

  # The Unix bridge remains statically linked. Windows has its own MSVC DLL
  # job, so a broken Windows compiler/linker cannot disguise a Unix failure.
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout cetas (with extension submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install moon (unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cetas-go/go.mod
          cache: false

      - name: moon version
        run: moon version --all

      - name: Resolve workspace
        run: moon update

      # Catches a Windows-only interface break in the bridge before the
      # expensive archive build hides it.
      - name: Check the bridge for this target
        run: moon check -p cetas-go/native_bridge --target native --deny-warn --output-json

      # Optimize MoonBit-generated C, dependency stubs, and runtime together.
      - name: Build size-optimized MoonBit compiler wrapper (unix)
        working-directory: cetas-go
        shell: bash
        run: |
          go test ./tools/moon-cc-wrapper -count=1
          go build -o "$RUNNER_TEMP/moon-cc-wrapper" ./tools/moon-cc-wrapper
          echo "MOON_CC_WRAPPER=$RUNNER_TEMP/moon-cc-wrapper" >> "$GITHUB_ENV"
          echo "MOONBIT_ALLOCATOR=system" >> "$GITHUB_ENV"

      - name: Compile MoonBit bridge archive
        shell: bash
        run: |
          moon build cetas-go/native_bridge --target native --release
          src="_build/native/release/build/colmugx/cetas-go/native_bridge/native_bridge.a"
          mkdir -p cetas-go/go_bridge/lib
          cp "$src" cetas-go/go_bridge/lib/libcetas_moon.a

      # Download modules before vet/test so transient Go proxy HTTP/2
      # failures can be retried without restarting the expensive MoonBit build.
      # This is shared native CI infrastructure, not a package-specific gate.
      - name: Resolve native Go modules (retry transient proxy failures)
        working-directory: cetas-go
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Go module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: go vet
        working-directory: cetas-go
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: go test
        working-directory: cetas-go
        env:
          CGO_ENABLED: '1'
        run: go test ./... -count=1

      # The cgo boundary is shared-memory by design; the race detector is the
      # tool-level guard for the Go side of that contract.
      - name: go test (race)
        working-directory: cetas-go
        env:
          CGO_ENABLED: '1'
        run: go test -race ./go_bridge/ ./harness/ ./internal/... -count=1

      # Fault-injection builds carry the transport failure probes; ordinary
      # builds must stay without them (see go_bridge/faults.go).
      - name: go test (fault injection tag)
        working-directory: cetas-go
        env:
          CGO_ENABLED: '1'
        run: go test -tags cetas_native_faults ./go_bridge/ -count=1

      - name: Prepare output directory
        shell: bash
        run: mkdir -p bin

      - name: Build the cetas binary
        working-directory: cetas-go
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -o ../bin/cetas .

      # Both dispatch modes must find their sibling and answer on every
      # platform: on Windows the handover is a supervised child, not execve.
      - name: Dispatch smoke (unix)
        run: |
          cd bin
          ./cetas --version
          cp cetas cetas-acp
          cp cetas cetas-run
          ./cetas acp --version
          ./cetas run --version


  # Independent Windows native path: MoonBit MSVC archive -> MSVC DLL ->
  # CGO_ENABLED=0 Go TUI. All runtime tests exercise the DLL ABI.
  native-windows:
    name: native (Windows DLL, no cgo)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/setup-go@v5
        with:
          go-version-file: cetas-go/go.mod
          cache: false
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Build MoonBit archive
        run: |
          moon update
          moon check -p cetas-go/native_bridge --target native --deny-warn --output-json
      - name: Build size-optimized MoonBit compiler wrapper (Windows)
        working-directory: cetas-go
        shell: pwsh
        run: |
          go test ./tools/moon-cc-wrapper -count=1
          go build -o "$env:RUNNER_TEMP\moon-cc-wrapper.exe" ./tools/moon-cc-wrapper
          "MOON_CC_WRAPPER=$env:RUNNER_TEMP\moon-cc-wrapper.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MOONBIT_ALLOCATOR=system" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build MoonBit archive (optimized)
        run: moon build cetas-go/native_bridge --target native --release
      - name: Link MSVC runtime DLL
        shell: pwsh
        run: ./cetas-go/tools/build_windows_dll.ps1 -OutputDir bin
      - name: Go vet (no cgo)
        working-directory: cetas-go
        env:
          CGO_ENABLED: '0'
          CETAS_NATIVE_DLL: ${{ github.workspace }}\bin\cetas_moon.dll
        run: go vet ./...
      - name: Go tests through MSVC DLL (no cgo)
        working-directory: cetas-go
        env:
          CGO_ENABLED: '0'
          CETAS_NATIVE_DLL: ${{ github.workspace }}\bin\cetas_moon.dll
        run: go test ./... -count=1
      - name: Build pure Go cetas.exe
        working-directory: cetas-go
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../bin/cetas.exe .
      - name: Binary and DLL smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./bin/cetas.exe --version
          Copy-Item ./bin/cetas.exe ./bin/cetas-acp.exe
          Copy-Item ./bin/cetas.exe ./bin/cetas-run.exe
          ./bin/cetas.exe acp --version
          ./bin/cetas.exe run --version
      - uses: actions/upload-artifact@v6
        with:
          name: cetas-go-windows-ci
          path: |
            bin/cetas.exe
            bin/cetas_moon.dll
