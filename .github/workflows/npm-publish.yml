# Manual npm publishing for the cetas submodule (repo github.com/colmugx/cetas).
#
# Dispatch this workflow with the release tag selected as the ref ("Use
# workflow from" dropdown) — no inputs. It downloads that tag's
# cetas-js-dist.tar.gz release asset, stages the single JS-only
# @posoco/cetas package (Node.js >= 24, no platform payloads), verifies it
# on ubuntu AND windows (npm install from the packed tarball + boot smoke),
# then publishes.
#
# Re-running a failed publish is safe: a version already on the registry is
# skipped, so no code commit is needed to retry.
#
# Bootstrap caveat: workflow_dispatch only lists refs that contain this
# workflow file, so it works for tags created after this file landed on the
# default branch — not for older tags.
#
# Needs an NPM_TOKEN secret on the cetas repo: an automation or granular
# token with publish rights for @posoco/cetas.
name: cetas npm publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: stage + pack the JS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: require a cetas-v tag ref
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/cetas-v* ]]; then
            echo "::error::run this workflow from a cetas-v* tag ref (got: ${GITHUB_REF})"
            exit 1
          fi

      - name: checkout cetas (scripts at the tag)
        uses: actions/checkout@v4

      - name: release check (version sync gate)
        run: python3 scripts/release.py check

      - name: download the dist asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'cetas-js-dist.tar.gz' \
            --dir staging

      - name: stage npm package
        run: python3 scripts/npm_stage.py --staging staging --out npm_out --version "${GITHUB_REF_NAME#cetas-v}"

      # npm pack is the exact content gate: only dist/cetas.js plus manifests
      # may ship, and never a sourcemap.
      - name: pack + content checks
        working-directory: npm_out/cetas
        run: |
          npm pack --pack-destination ../..
          version="${GITHUB_REF_NAME#cetas-v}"
          tarball="colmugx-cetas-${version}.tgz"
          listing=$(tar -tzf "${tarball}" | sort)
          echo "$listing"
          diff -u <(printf '%s\n' \
            "package/LICENSE" \
            "package/README.md" \
            "package/dist/cetas.js" \
            "package/package.json") <(echo "$listing") \
            || { echo "::error::unexpected files in the npm tarball"; exit 1; }

      - name: upload packed tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-tarball
          path: colmugx-cetas-*.tgz

  verify-windows:
    name: install + boot smoke (windows)
    needs: [stage]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: setup node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: download packed tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-tarball

      # Install from the packed tarball (exactly what the registry will
      # serve) and boot the bin: the TUI must render the welcome banner
      # before the timeout stop. pi-tui's win32-console-mode.node must load
      # from its npm install during that boot.
      - name: npm install + boot smoke
        shell: pwsh
        run: |
          $tarball = (Get-ChildItem -Filter "colmugx-cetas-*.tgz").FullName
          npm install -g "$tarball"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::npm install failed"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP "boot.log"
          $proc = Start-Process -FilePath "cetas" -PassThru `
            -RedirectStandardOutput "$log" -RedirectStandardError "$env:RUNNER_TEMP\boot.err"
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "::error::cetas exited early with $($proc.ExitCode)"
            Get-Content "$log", "$env:RUNNER_TEMP\boot.err" -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Select-String -Path "$log" -Pattern "cetas" -Quiet | Out-Null
          if (-not $?) { Write-Host "::error::welcome banner missing"; Get-Content "$log"; exit 1 }

  publish:
    name: publish @posoco/cetas
    needs: [stage, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout cetas (scripts at the tag)
        uses: actions/checkout@v4

      - name: release check (version sync gate)
        run: python3 scripts/release.py check

      - name: download the dist asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'cetas-js-dist.tar.gz' \
            --dir staging

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: stage npm packages
        run: python3 scripts/npm_stage.py --staging staging --out npm_out --version "${GITHUB_REF_NAME#cetas-v}"

      - name: publish (skip already-published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cetas-v}"
          if npm view "@posoco/cetas@${version}" version >/dev/null 2>&1; then
            echo "skip @posoco/cetas@${version} (already published)"
          else
            npm publish --access public "./npm_out/cetas"
          fi
