# Manual npm publishing for the cetas submodule (repo github.com/colmugx/cetas).
#
# Run this workflow from main and enter the release tag (e.g. cetas-v0.8.0).
# The latest workflow publishes the immutable release asset and uses package
# staging scripts checked out at that tag. It downloads the tag's
# cetas-js-dist.tar.gz release asset, stages the single JS-only
# @posoco/cetas package (Node.js >= 24, no platform payloads), validates the pack contents and version,
# then publishes.
#
# Re-running a failed publish is safe: a version already on the registry is
# skipped, so no code commit is needed to retry.
#
# Selecting a tag as the workflow ref also selects its historical workflow
# source. Select main when publishing or retrying an older release.
#
# Needs an NPM_TOKEN secret on the cetas repo: an automation or granular
# token with publish rights for @posoco/cetas.
name: cetas npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. cetas-v0.8.0)"
        type: string
        required: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  stage:
    name: stage + pack the JS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: require a cetas-v release tag
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^cetas-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Provide a cetas-vX.Y.Z tag. For old releases, run this workflow from main and fill the tag input (got: ${RELEASE_TAG})."
            exit 1
          fi

      - name: checkout cetas (scripts at the tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: release check (version sync gate)
        run: python3 scripts/release.py check

      - name: download the dist asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'cetas-js-dist.tar.gz' \
            --dir staging

      - name: stage npm package
        run: python3 scripts/npm_stage.py --staging staging --out npm_out --version "${RELEASE_TAG#cetas-v}"

      # npm pack is the exact content gate: only dist/cetas.js plus manifests
      # may ship, and never a sourcemap.
      - name: pack + content checks
        working-directory: npm_out/cetas
        run: |
          version="${RELEASE_TAG#cetas-v}"
          tarball="$(npm pack --pack-destination ../.. --silent)"
          expected="posoco-cetas-${version}.tgz"
          if [[ "${tarball}" != "${expected}" ]]; then
            echo "::error::npm pack produced '${tarball}', expected '${expected}'"
            exit 1
          fi
          listing=$(tar -tzf "../../${tarball}" | LC_ALL=C sort)
          echo "$listing"
          diff -u <(printf '%s\n' \
            "package/LICENSE" \
            "package/README.md" \
            "package/dist/cetas.js" \
            "package/package.json") <(echo "$listing") \
            || { echo "::error::unexpected files in the npm tarball"; exit 1; }

      - name: upload packed tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-tarball
          path: posoco-cetas-*.tgz
          if-no-files-found: error

  publish:
    name: publish @posoco/cetas
    needs: [stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout cetas (scripts at the tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: release check (version sync gate)
        run: python3 scripts/release.py check

      - name: download the dist asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'cetas-js-dist.tar.gz' \
            --dir staging

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: stage npm packages
        run: python3 scripts/npm_stage.py --staging staging --out npm_out --version "${RELEASE_TAG#cetas-v}"

      - name: publish (skip already-published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${RELEASE_TAG#cetas-v}"
          if npm view "@posoco/cetas@${version}" version >/dev/null 2>&1; then
            echo "skip @posoco/cetas@${version} (already published)"
          else
            npm publish --access public "./npm_out/cetas"
          fi
