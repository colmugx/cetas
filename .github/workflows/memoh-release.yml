# Independent Memoh tag/release, shared root Cetas workspace.
name: memoh-release

on:
  push:
    tags: ["cetas-memoh-v*"]

permissions:
  contents: write

jobs:
  memoh-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout Cetas with shared extension
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: validate independent Memoh version
        run: |
          python3 cetas-memoh/scripts/check_version.py
          expected="cetas-memoh-v$(cat cetas-memoh/VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || {
            echo "::error::tag mismatch: got '$GITHUB_REF_NAME', want '$expected'"
            exit 1
          }
          bash -n cetas-memoh/install.sh

      - name: resolve shared root workspace
        run: moon update

      - name: harness self-check
        run: moon run --target native cetas-memoh/scripts/memoh_live_e2e.mbtx -- --self-check

      - name: typecheck Memoh
        run: |
          moon check -p cetas-memoh/lib --target native --deny-warn --output-json
          moon check -p cetas-memoh/main --target native --deny-warn --output-json

      - name: test Memoh
        run: moon test cetas-memoh/lib --target native --output-json

      - name: build Linux x86_64
        run: moon build cetas-memoh/main --target native --release

      - name: smoke-test and package
        run: |
          expected="cetas-memoh $(cat cetas-memoh/VERSION)"
          out="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --version)"
          [[ "$out" == "$expected" ]] || {
            echo "::error::version mismatch: got '$out', want '$expected'"
            exit 1
          }
          mkdir -p cetas-memoh/dist
          cp _build/native/release/build/colmugx/cetas-memoh/main/main.exe cetas-memoh/dist/cetas-memoh
          (
            cd cetas-memoh/dist
            tar -czf cetas-memoh-linux-x64.tar.gz cetas-memoh
            sha256sum cetas-memoh-linux-x64.tar.gz > SHA256SUMS-memoh
          )
          {
            printf "cetas=%s\n" "$(git rev-parse HEAD)"
            printf "extension=%s\n" "$(git rev-parse HEAD:extension)"
          } > cetas-memoh/dist/SOURCE_REVISIONS-memoh

      - name: publish Memoh release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            cetas-memoh/dist/cetas-memoh-linux-x64.tar.gz
            cetas-memoh/dist/SHA256SUMS-memoh
            cetas-memoh/dist/SOURCE_REVISIONS-memoh
