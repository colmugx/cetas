# Dedicated Linux x86_64 release pipeline for cetas-memoh.
name: memoh-release

on:
  push:
    tags: ["cetas-memoh-v*"]
  workflow_dispatch:
    inputs:
      cetas_ref:
        description: "cetas ref containing the cetas-memoh source"
        default: "main"

permissions:
  contents: write

env:
  CETAS_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.cetas_ref || github.ref }}

jobs:
  memoh-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: memoh-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CETAS_REF }}
          sparse-checkout: |
            /cetas-memoh/
          sparse-checkout-cone-mode: false

      - name: memoh-install-moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: memoh-version-sync
        working-directory: cetas-memoh
        run: python3 scripts/check_version.py

      - name: memoh-tag-version
        if: github.event_name == 'push'
        working-directory: cetas-memoh
        run: |
          expected="${GITHUB_REF_NAME#cetas-memoh-v}"
          actual="$(cat VERSION)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::tag/version mismatch: tag=$expected file=$actual"
            exit 1
          }

      - name: memoh-harness-unit
        working-directory: cetas-memoh
        run: python3 -m unittest scripts/test_memoh_live_e2e.py

      - name: memoh-install-script-syntax
        working-directory: cetas-memoh
        run: bash -n install.sh

      - name: memoh-bootstrap-workspace
        working-directory: cetas-memoh
        run: python3 scripts/bootstrap_workspace.py

      - name: memoh-update
        working-directory: cetas-memoh
        run: moon update

      - name: memoh-check
        working-directory: cetas-memoh
        run: moon check --target native --deny-warn --output-json

      - name: memoh-test
        working-directory: cetas-memoh
        run: moon test --target native --output-json

  memoh-build-linux-x64:
    needs: [memoh-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: memoh-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CETAS_REF }}
          sparse-checkout: |
            /cetas-memoh/
          sparse-checkout-cone-mode: false

      - name: memoh-install-moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: memoh-bootstrap-workspace
        working-directory: cetas-memoh
        run: python3 scripts/bootstrap_workspace.py

      - name: memoh-update
        working-directory: cetas-memoh
        run: moon update

      - name: memoh-build-release
        working-directory: cetas-memoh
        run: moon build --target native --release

      - name: memoh-version-smoke
        working-directory: cetas-memoh
        run: |
          expected="cetas-memoh $(cat VERSION)"
          out="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --version)"
          echo "$out"
          [[ "$out" == "$expected" ]] || {
            echo "::error::--version mismatch: got '$out', want '$expected'"
            exit 1
          }

      - name: memoh-package
        working-directory: cetas-memoh
        run: |
          mkdir -p dist
          cp "_build/native/release/build/colmugx/cetas-memoh/main/main.exe" "dist/cetas-memoh"
          (
            cd dist
            tar -czf cetas-memoh-linux-x64.tar.gz cetas-memoh
            sha256sum cetas-memoh-linux-x64.tar.gz > SHA256SUMS-memoh
          )

      - name: memoh-upload
        uses: actions/upload-artifact@v6
        with:
          name: memoh-linux-x64
          path: |
            cetas-memoh/dist/cetas-memoh-linux-x64.tar.gz
            cetas-memoh/dist/SHA256SUMS-memoh

  memoh-publish:
    needs: [memoh-build-linux-x64]
    if: startsWith(github.ref, 'refs/tags/cetas-memoh-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: memoh-download
        uses: actions/download-artifact@v7
        with:
          name: memoh-linux-x64
          path: memoh-staging

      - name: memoh-publish-assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memoh-staging/cetas-memoh-linux-x64.tar.gz
            memoh-staging/SHA256SUMS-memoh
