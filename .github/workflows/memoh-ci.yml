# Memoh CI uses the same root workspace and extension submodule as every Cetas surface.
name: memoh-ci

on:
  push:
    branches: [main]
    paths:
      - "cetas-memoh/**"
      - "extension"
      - "moon.work"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"
  pull_request:
    paths:
      - "cetas-memoh/**"
      - "extension"
      - "moon.work"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"

permissions:
  contents: read

jobs:
  memoh-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout Cetas with shared extension
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: check Memoh version declarations
        run: python3 cetas-memoh/scripts/check_version.py

      - name: check installer syntax
        run: bash -n cetas-memoh/install.sh

      - name: resolve shared root workspace
        run: moon update

      - name: harness self-check
        run: moon run --target native cetas-memoh/scripts/memoh_live_e2e.mbtx -- --self-check

      - name: typecheck Memoh library and executable
        run: |
          moon check -p cetas-memoh/lib --target native --deny-warn --output-json
          moon check -p cetas-memoh/main --target native --deny-warn --output-json

      - name: test shared native bootstrap
        run: moon test cetas-bootstrap/lib --target native --output-json

      - name: test Run native login compatibility
        run: moon test cetas-run/lib --target native --output-json

      - name: test Memoh
        run: moon test cetas-memoh/lib --target native --output-json

      - name: build Memoh
        run: moon build cetas-memoh/main --target native --release

      - name: smoke-test version
        run: |
          expected="cetas-memoh $(cat cetas-memoh/VERSION)"
          out="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --version)"
          [[ "$out" == "$expected" ]] || {
            echo "::error::version mismatch: got '$out', want '$expected'"
            exit 1
          }
          help="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --help)"
          [[ "$help" == *"login [provider]"* ]] || {
            echo "::error::Memoh CLI help omits standalone login"
            exit 1
          }

      - name: check Memoh formatting
        run: |
          moon fmt
          git diff --exit-code -- cetas-memoh
