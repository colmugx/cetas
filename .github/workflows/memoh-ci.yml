# Dedicated standalone CI for cetas-memoh.
name: memoh-ci

on:
  push:
    branches:
      - main
    paths:
      - "cetas-memoh/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"
  pull_request:
    paths:
      - "cetas-memoh/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"

jobs:
  memoh-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: memoh-checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /cetas-memoh/
          sparse-checkout-cone-mode: false

      - name: memoh-install-moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: memoh-version-sync
        working-directory: cetas-memoh
        run: python3 scripts/check_version.py

      - name: memoh-harness-unit
        working-directory: cetas-memoh
        run: python3 -m unittest scripts/test_memoh_live_e2e.py

      - name: memoh-install-script-syntax
        working-directory: cetas-memoh
        run: bash -n install.sh

      - name: memoh-bootstrap-workspace
        working-directory: cetas-memoh
        run: python3 scripts/bootstrap_workspace.py

      - name: memoh-update
        working-directory: cetas-memoh
        run: moon update

      - name: memoh-check
        working-directory: cetas-memoh
        run: moon check --target native --deny-warn --output-json

      - name: memoh-test
        working-directory: cetas-memoh
        run: moon test --target native --output-json

      - name: memoh-build-release
        working-directory: cetas-memoh
        run: moon build --target native --release

      - name: memoh-version-smoke
        working-directory: cetas-memoh
        run: |
          expected="cetas-memoh $(cat VERSION)"
          out="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --version)"
          [[ "$out" == "$expected" ]] || {
            echo "::error::--version mismatch: got '$out', want '$expected'"
            exit 1
          }

      - name: memoh-fmt
        working-directory: cetas-memoh
        run: moon fmt

      - name: memoh-drift
        run: git diff --exit-code -- cetas-memoh
