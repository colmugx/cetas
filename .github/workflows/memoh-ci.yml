# Dedicated cetas-memoh CI. Keep Memoh checks out of the general Cetas pipeline.
name: memoh-ci

on:
  push:
    branches:
      - main
    paths:
      - "cetas-memoh/**"
      - "scripts/memoh_live_e2e.py"
      - "scripts/test_memoh_live_e2e.py"
      - "scripts/release.py"
      - "VERSION"
      - "moon.work"
      - "extension"
      - "extension/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"
  pull_request:
    paths:
      - "cetas-memoh/**"
      - "scripts/memoh_live_e2e.py"
      - "scripts/test_memoh_live_e2e.py"
      - "scripts/release.py"
      - "VERSION"
      - "moon.work"
      - "extension"
      - "extension/**"
      - ".github/workflows/memoh-ci.yml"
      - ".github/workflows/memoh-release.yml"
      - ".github/workflows/memoh-live-e2e.yml"

jobs:
  memoh-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CETAS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout posoco parent (recursively)
        uses: actions/checkout@v4
        with:
          repository: colmugx/posoco
          ref: main
          path: posoco
          submodules: recursive

      - name: Switch cetas submodule to event commit
        shell: bash
        working-directory: posoco/external/cetas
        run: |
          git fetch --depth=1 origin "${CETAS_SHA}"
          git checkout "${CETAS_SHA}"
          git submodule update --init --recursive

      - name: Install moon (Unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: memoh-version-sync
        working-directory: posoco/external/cetas
        run: python3 scripts/release.py check --scope memoh

      - name: memoh-harness-unit
        working-directory: posoco/external/cetas
        run: python3 -m unittest scripts/test_memoh_live_e2e.py

      - name: memoh-update
        working-directory: posoco/external/cetas/cetas-memoh
        run: moon update

      - name: memoh-check
        working-directory: posoco/external/cetas/cetas-memoh
        run: moon check --target native --deny-warn --output-json

      - name: memoh-test
        working-directory: posoco/external/cetas/cetas-memoh
        run: moon test --target native --output-json

      - name: memoh-build-release
        working-directory: posoco/external/cetas/cetas-memoh
        run: moon build --target native --release

      - name: memoh-version-smoke
        working-directory: posoco/external/cetas
        shell: bash
        run: |
          expected="cetas-memoh $(cat VERSION)"
          out="$(_build/native/release/build/colmugx/cetas-memoh/main/main.exe --version)"
          [[ "$out" == "$expected" ]] || { echo "::error::--version mismatch: got '$out', want '$expected'"; exit 1; }

      - name: memoh-fmt
        working-directory: posoco/external/cetas/cetas-memoh
        run: moon fmt

      - name: memoh-drift
        working-directory: posoco/external/cetas/cetas-memoh
        run: git diff --exit-code -- .
