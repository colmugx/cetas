name: cetas-native Go/Bubble Tea validation

concurrency:
  group: cetas-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cetas-native/**"
      - "cetas-console/**"
      - "cetas-core/**"
      - "extension/**"
      - "moon.work"
      - ".github/workflows/cetas-tui-validation.yml"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve workspace
        run: moon update
      - name: Check native bridge
        run: moon check -p cetas-native/native_bridge --target native --deny-warn
      - name: Compile MoonBit Posoco static archive
        run: python3 cetas-native/tools/build_static.py
      - name: Go dependencies
        working-directory: cetas-native
        run: go mod tidy
      - name: Build and test Bubble Tea host
        working-directory: cetas-native
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./... -count=1
          go build -o ../_build/cetas-native-go .
      - name: Headless PTY terminal ownership smoke
        run: python3 cetas-native/tools/pty_smoke.py
      - name: Fresh-home provider bootstrap PTY smoke
        run: python3 cetas-native/tools/pty_bootstrap_smoke.py
      - name: Offline first-run credential and restart PTY smoke
        run: python3 cetas-native/tools/pty_bootstrap_login_smoke.py
      - name: Interactive PTY approval and question smoke
        run: python3 cetas-native/tools/pty_ui_smoke.py
      - name: Package opt-in native Alpha candidate
        shell: bash
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          os="$(go env GOOS)"
          artifact="cetas-native-alpha-${os}-${arch}"
          mkdir -p "stage/${artifact}"
          cp _build/cetas-native-go "stage/${artifact}/cetas-native"
          cp cetas-native/ALPHA.md "stage/${artifact}/ALPHA.md"
          chmod +x "stage/${artifact}/cetas-native"
          cd stage
          tar -czf "${artifact}.tar.gz" "${artifact}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"
          else
            shasum -a 256 "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256"
          fi
      - name: Upload opt-in native Alpha candidate
        uses: actions/upload-artifact@v6
        with:
          name: cetas-native-alpha-${{ runner.os }}-${{ runner.arch }}
          path: |
            stage/cetas-native-alpha-*.tar.gz
            stage/cetas-native-alpha-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Check Rust elimination
        run: |
          test ! -e cetas-native/native/cetas-tui
          if find cetas-native -type f \( -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \) | grep .; then
            echo 'retired Rust terminal sources remain' >&2
            exit 1
          fi
