name: cetas-tui validation

concurrency:
  group: cetas-tui-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cetas-native/**"
      - "moon.work"
      - ".github/workflows/cetas-tui-validation.yml"

jobs:
  linux-staticlib-moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout cetas
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          moon version --all
          rustc --version
          cargo --version
          node --version

      - name: Resolve MoonBit dependencies
        working-directory: cetas-native
        run: moon update

      - name: Rust tests
        working-directory: cetas-native/native/cetas-tui
        run: cargo test --release

      - name: MoonBit native check
        working-directory: cetas-native
        run: moon check -p cetas-native/src --target native --deny-warn

      - name: MoonBit native app tests
        working-directory: cetas-native
        run: moon test -p cetas-native/src/app --target native

      - name: Shared semantic parity fixtures
        working-directory: cetas-native
        run: python3 scripts/parity_smoke.py

      - name: Build and run FFI + PTY inline smoke test
        working-directory: cetas-native
        run: python3 scripts/pty_smoke.py
